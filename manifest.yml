# manifest.yml — declarative config for the AI agent home
#
# Read by setup.sh. This file uses a deliberately constrained YAML subset so
# the setup script can parse it without external dependencies:
#
#   - top-level scalar keys:        key: value
#   - top-level list-of-map keys:   list items start with "- key: value",
#                                   continuation lines are "  key: value"
#   - comments (#) and blank lines are ignored
#   - no nesting beyond the shapes shown below, no multi-line values
#
# Sections:
#
#   agent_home   canonical agent home path (usually a symlink to this repo's
#                clone; setup resolves symlinks and works either way)
#
#   repos        external skill repos cloned under <agent_home>/repos/.
#                Each repo exposes skills as skills/<name>/SKILL.md.
#                This repo (ai-agent-home) is the base install and is NOT
#                listed here.
#                  name     directory name under repos/ (required)
#                  url      git clone URL (required)
#                  branch   branch to clone/track (default: main)
#                  enabled  false skips clone/update/skill-linking (default: true)
#                  update   false skips `git pull` on setup runs (default: true)
#
#   tool_links   coding-agent harnesses to wire to the shared agent home.
#                For each tool, setup creates inside config_dir:
#                  <instructions_link> -> <agent_home>/AGENTS.md
#                  <skills_link>       -> <agent_home>/skills
#                Tools whose config_dir does not exist are skipped.
#
#   config_links individual settings/hook files centralized under
#                <agent_home>/home-config/ and linked back out to their
#                native per-tool location.
#                  name   label used in setup.sh output (required)
#                  src    path relative to <agent_home> (required)
#                  dst    native destination path, ~ expanded (required)
#                Only use this for files that are pure preference/config, not
#                files a tool treats as machine-local mutable state (trust
#                lists, install caches, timestamps) — those don't belong
#                here. dst's parent directory must already exist; entries
#                whose dst parent is missing are skipped.

agent_home: ~/.agents

repos:
  - name: ai-agent-coder
    url: git@github.com:darrencroton/ai-agent-coder.git
    branch: main
    enabled: true
    update: true

  # Paper-writing skills for astronomy. Exposes paper-start, paper-draft and
  # paper-lit; skills/_shared/ has no SKILL.md and is correctly not linked as a
  # skill, staying reachable as ../_shared/ from each linked skill. tools/ and
  # skeleton/ sit above skills/ and are resolved from the skill path — see that
  # repo's skills/_shared/house-rules.md, "Locating the installation".
  - name: sci-paper
    url: git@github.com:darrencroton/sci-paper.git
    branch: main
    enabled: true
    update: true

tool_links:
  - name: claude
    config_dir: ~/.claude
    instructions_link: CLAUDE.md
    skills_link: skills

  - name: codex
    config_dir: ~/.codex
    instructions_link: AGENTS.md
    skills_link: skills

  - name: opencode
    config_dir: ~/.config/opencode
    instructions_link: AGENTS.md
    skills_link: skills

  - name: copilot
    config_dir: ~/.copilot
    instructions_link: copilot-instructions.md
    skills_link: skills

  - name: qwen
    config_dir: ~/.qwen
    instructions_link: QWEN.md
    skills_link: skills

config_links:
  - name: claude-settings
    src: home-config/claude/settings.json
    dst: ~/.claude/settings.json

  # Linked straight from the skill repo rather than copied into home-config:
  # the hook is code the project-manager skill owns and ships tests for, so a
  # private copy here drifts from it silently. It did — the live hook sat well
  # behind the repo and nothing surfaced the gap. Tracking the repo makes the
  # hook behave like the rest of the skill, which is already linked this way.
  - name: claude-hook-pm-poll-guard
    src: repos/ai-agent-coder/skills/project-manager/hooks/pm-poll-guard.py
    dst: ~/.claude/hooks/pm-poll-guard.py

  - name: claude-statusline
    src: home-config/claude/statusline-command.sh
    dst: ~/.claude/statusline-command.sh

  - name: copilot-settings
    src: home-config/copilot/settings.json
    dst: ~/.copilot/settings.json

  - name: qwen-settings
    src: home-config/qwen/settings.json
    dst: ~/.qwen/settings.json

  - name: opencode-settings
    src: home-config/opencode/opencode.json
    dst: ~/.config/opencode/opencode.json
